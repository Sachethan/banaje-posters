<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification Test</title>
</head>
<body>
  <h2>Notification Test</h2>
  <button onclick="testNotification()">Enable & Test Notification</button>
  <p id="status"></p>

  <script>
    async function testNotification() {
      const status = document.getElementById("status");

      if (!("Notification" in window)) {
        status.textContent = "Notifications are not supported in this browser.";
        return;
      }

      if (!window.isSecureContext) {
        status.textContent = "Error: Open this page using HTTPS or localhost.";
        return;
      }

      try {
        let permission = Notification.permission;

        if (permission === "default") {
          permission = await Notification.requestPermission();
        }

        if (permission !== "granted") {
          status.textContent = "Permission denied. Allow notifications in browser settings.";
          return;
        }

        const notification = new Notification("Test Successful!", {
          body: "Your browser notification is working!",
          tag: "notification-test"
        });

        status.textContent = "Notification sent successfully!";
      } catch (error) {
        status.textContent = "Error: " + error.message;
        console.error(error);
      }
    }
  </script>
</body>
</html>
