<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics Dashboard - User Logs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: { dark: { 900: '#0f172a', 800: '#1e293b', 700: '#334155' } }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body class="bg-dark-900 text-slate-200 min-h-screen flex flex-col p-4 sm:p-6 lg:p-8">

  <!-- Header -->
  <header class="max-w-5xl mx-auto w-full mb-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 border-b border-slate-700/60 pb-4">
    <div>
      <h1 class="text-xl sm:text-2xl font-bold text-white tracking-tight flex items-center gap-2">
        <span class="inline-block w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
        Activity & User Analytics
      </h1>
      <p class="text-xs text-slate-400 mt-1">Real-time log viewer fetched directly from Google Sheets</p>
    </div>
    <button id="refresh-btn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-xs font-semibold text-white rounded-lg transition duration-150 flex items-center gap-2 shadow-sm self-stretch sm:self-auto justify-center">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
      Refresh Logs
    </button>
  </header>

  <!-- Container for Sheets/User Accordions -->
  <main class="max-w-5xl mx-auto w-full flex-grow">
    <!-- Status & Loading Indicator -->
    <div id="status-container" class="py-12 flex flex-col items-center justify-center text-center">
      <div class="w-8 h-8 border-2 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin mb-3"></div>
      <p class="text-sm text-slate-400">Loading user tabs and log entries...</p>
    </div>

    <!-- Accordion List -->
    <div id="sheets-container" class="space-y-3 hidden"></div>
  </main>

  <footer class="max-w-5xl mx-auto w-full text-center py-6 text-xs text-slate-500 border-t border-slate-800 mt-8">
    Log Viewer &bull; No Apps Script Modification Required
  </footer>

  <script>
    // -------------------------------------------------------------
    // CONFIGURATION: Replace with your Spreadsheet ID
    // -------------------------------------------------------------
    const SPREADSHEET_ID = "11VJ9sxd6MC8zcEBMvKMeuztG-zAaFGt7eI7IwdPS5JI";

    const statusContainer = document.getElementById("status-container");
    const sheetsContainer = document.getElementById("sheets-container");
    const refreshBtn = document.getElementById("refresh-btn");

    // Fetch tab names directly from Google Sheets HTML export metadata
    async function getSheetTabNames(sheetId) {
      const url = `https://docs.google.com/spreadsheets/d/${sheetId}/htmlview`;
      const response = await fetch(url);
      const htmlText = await response.text();
      
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlText, "text/html");
      const tabElements = doc.querySelectorAll("#sheet-menu li");

      const names = [];
      if (tabElements.length > 0) {
        tabElements.forEach(li => names.push(li.textContent.trim()));
      } else {
        // Fallback: search regex in case markup varies
        const matches = [...htmlText.matchAll(/name:\s*"([^"]+)"/g)];
        matches.forEach(m => {
          if (!names.includes(m[1])) names.push(m[1]);
        });
      }
      return names;
    }

    // Fetch tabular data from a specific tab using Google Visualization API (GViz)
    async function getSheetData(sheetId, tabName) {
      const gvizUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(tabName)}`;
      const response = await fetch(gvizUrl);
      const text = await response.text();

      // GViz wraps JSON in /*O_o*/ google.visualization.Query.setResponse({...});
      const jsonStart = text.indexOf('{');
      const jsonEnd = text.lastIndexOf('}');
      if (jsonStart === -1 || jsonEnd === -1) throw new Error("Invalid GViz format");

      const rawJson = JSON.parse(text.substring(jsonStart, jsonEnd + 1));
      const cols = rawJson.table.cols.map(c => (c && c.label) ? c.label : "");
      
      const rows = [];
      rawJson.table.rows.forEach(r => {
        const rowVals = r.c ? r.c.map(cell => (cell && cell.v !== null && cell.v !== undefined) ? (cell.f || cell.v) : "") : [];
        rows.push(rowVals);
      });

      return { headers: cols, rows: rows };
    }

    // Build the accordion elements
    async function loadAllTabs() {
      statusContainer.classList.remove("hidden");
      statusContainer.innerHTML = `
        <div class="w-8 h-8 border-2 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin mb-3"></div>
        <p class="text-sm text-slate-400">Fetching user sessions...</p>
      `;
      sheetsContainer.classList.add("hidden");
      sheetsContainer.innerHTML = "";

      try {
        const tabNames = await getSheetTabNames(SPREADSHEET_ID);

        if (!tabNames || tabNames.length === 0) {
          statusContainer.innerHTML = `
            <div class="bg-dark-800 p-6 rounded-xl border border-slate-700 max-w-md">
              <p class="text-amber-400 font-medium mb-1">No Tabs Found</p>
              <p class="text-xs text-slate-400">Ensure your Google Sheet is shared as <strong>"Anyone with the link can view"</strong> and has at least one tab.</p>
            </div>
          `;
          return;
        }

        // Render an accordion card for each tab
        tabNames.forEach((tabName) => {
          const card = document.createElement("div");
          card.className = "bg-dark-800 border border-slate-700/80 rounded-xl overflow-hidden transition-all duration-200 hover:border-slate-600 shadow-sm";

          card.innerHTML = `
            <button class="w-full px-4 py-3.5 flex items-center justify-between text-left focus:outline-none select-none transition-colors hover:bg-slate-800/60" data-tab="${encodeURIComponent(tabName)}">
              <div class="flex items-center gap-3 overflow-hidden">
                <span class="p-1.5 rounded-lg bg-indigo-500/10 text-indigo-400 flex-shrink-0">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </span>
                <span class="font-medium text-sm text-white truncate">${tabName}</span>
              </div>
              <div class="flex items-center gap-2 flex-shrink-0 ml-2">
                <span class="badge text-[11px] bg-slate-700/60 text-slate-300 px-2 py-0.5 rounded-full font-mono">Click to view</span>
                <svg class="chevron w-4 h-4 text-slate-400 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
              </div>
            </button>
            <div class="content-panel hidden border-t border-slate-700/50 p-3 sm:p-4 bg-dark-900/60">
              <div class="loading-state text-xs text-slate-400 py-4 text-center flex items-center justify-center gap-2">
                <span class="w-3 h-3 border border-indigo-400 border-t-transparent rounded-full animate-spin"></span>
                Loading records...
              </div>
              <div class="table-container hidden overflow-x-auto rounded-lg border border-slate-700/50">
                <table class="w-full text-left text-xs whitespace-nowrap">
                  <thead class="bg-slate-800/80 text-slate-300 font-semibold uppercase tracking-wider text-[10px] border-b border-slate-700"></thead>
                  <tbody class="divide-y divide-slate-800 text-slate-300"></tbody>
                </table>
              </div>
            </div>
          `;

          const btn = card.querySelector("button");
          const panel = card.querySelector(".content-panel");
          const chevron = card.querySelector(".chevron");
          const tableContainer = card.querySelector(".table-container");
          const loadingState = card.querySelector(".loading-state");
          const thead = card.querySelector("thead");
          const tbody = card.querySelector("tbody");
          const badge = card.querySelector(".badge");

          let isLoaded = false;

          btn.addEventListener("click", async () => {
            const isHidden = panel.classList.contains("hidden");

            if (isHidden) {
              panel.classList.remove("hidden");
              chevron.classList.add("rotate-180");

              // Fetch tab data on first click
              if (!isLoaded) {
                try {
                  const data = await getSheetData(SPREADSHEET_ID, tabName);

                  // Extract headers
                  let headers = data.headers;
                  let rows = data.rows;

                  // If GViz columns didn't label row 1, use row 1 as headers
                  if (headers.every(h => !h) && rows.length > 0) {
                    headers = rows[0];
                    rows = rows.slice(1);
                  }

                  // REVERSE ROWS so latest data is at the top
                  const reversedRows = [...rows].reverse();

                  // Render table headers
                  thead.innerHTML = `<tr>${headers.map(h => `<th class="px-3.5 py-2.5">${h || '—'}</th>`).join('')}</tr>`;

                  // Render table rows
                  if (reversedRows.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="${headers.length || 1}" class="text-center py-4 text-slate-500 italic">No activity recorded yet</td></tr>`;
                  } else {
                    tbody.innerHTML = reversedRows.map(row => {
                      return `<tr class="hover:bg-slate-800/40 transition">
                        ${row.map(val => `<td class="px-3.5 py-2.5">${val !== "" ? val : "—"}</td>`).join('')}
                      </tr>`;
                    }).join('');
                  }

                  badge.textContent = `${reversedRows.length} entry${reversedRows.length === 1 ? '' : 'ies'}`;
                  badge.className = "badge text-[11px] bg-indigo-900/40 text-indigo-300 border border-indigo-700/50 px-2 py-0.5 rounded-full font-mono";

                  loadingState.classList.add("hidden");
                  tableContainer.classList.remove("hidden");
                  isLoaded = true;
                } catch (err) {
                  loadingState.innerHTML = `<span class="text-rose-400">Failed to load tab data. Check sheet permissions.</span>`;
                }
              }
            } else {
              panel.classList.add("hidden");
              chevron.classList.remove("rotate-180");
            }
          });

          sheetsContainer.appendChild(card);
        });

        statusContainer.classList.add("hidden");
        sheetsContainer.classList.remove("hidden");

      } catch (err) {
        statusContainer.innerHTML = `
          <div class="bg-dark-800 p-5 rounded-xl border border-red-500/40 text-red-300 text-xs">
            <p class="font-semibold mb-1">Failed to fetch sheet info</p>
            <p>${err.message}</p>
          </div>
        `;
      }
    }

    refreshBtn.addEventListener("click", loadAllTabs);
    window.addEventListener("DOMContentLoaded", loadAllTabs);
  </script>
</body>
</html>
