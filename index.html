<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bhajane - Template Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1976d2" />
<meta name="mobile-web-app-capable" content="yes" />

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('SW registered:', reg))
        .catch(err => console.error('SW error:', err));
    });
  }
</script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { dark: { 900: '#0f172a', 800: '#1e293b', 700: '#334155' } }
                }
            }
        }
    </script>
    <style>
/* --- Main Studio CSS --- */
body { 
    font-family: 'Inter', sans-serif; 
    -webkit-font-smoothing: antialiased; 
}

/* Custom Scrollbar for the Gallery Grid */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: #0f172a; }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

.spinner { 
    width: 40px; height: 40px; 
    border: 3px solid rgba(99, 102, 241, 0.3); 
    border-radius: 50%; border-top-color: #6366f1; 
    animation: spin 0.8s ease-in-out infinite; 
}

@keyframes spin { to { transform: rotate(360deg); } }

.template-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
.template-card:hover { transform: translateY(-4px); border-color: #6366f1; }

.text-gradient { 
    background-clip: text; 
    -webkit-background-clip: text; 
    -webkit-text-fill-color: transparent; 
    background-image: linear-gradient(to right, #818cf8, #c084fc, #22d3ee); 
}

footer { text-align: center; padding: 40px; color: #666; }

/* Hiding the Iframe Scrollbar via Clipping */
#iframe-container {
    overflow: hidden;
    position: absolute;
    inset: 0;
    z-index: 40;
}

#viewer {
    width: calc(100% + 20px); 
    height: 100%;
    border: none;
}
</style>
</head>
<body class="bg-dark-900 text-slate-200 flex flex-col h-screen overflow-hidden">

    <header class="h-16 flex-shrink-0 z-30 relative border-b border-slate-700/50 bg-dark-900/90 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 h-full flex items-center justify-between relative">
            <div class="flex items-center gap-4">
                <div id="branding-container">
                    <h1 class="text-sm font-bold text-white">Bhajane <span class="text-gradient">Templates</span></h1>
                    <div class="text-[10px] text-slate-400 font-mono tracking-wider flex items-center gap-1 mt-0.5">
                        <span>ID:</span>
                        <button id="user-id-btn" title="Click to rename" class="group flex items-center gap-1 text-indigo-400 font-semibold bg-slate-800/80 hover:bg-slate-700/80 px-1.5 py-0.5 rounded border border-slate-700/60 leading-none transition">
                            <span id="display-user-id">Loading...</span>
                            <svg class="w-2.5 h-2.5 opacity-60 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                        </button>
                    </div>
                </div>
            </div>
            <div id="editor-nav" class="hidden text-xs bg-slate-800/50 px-3 py-1.5 rounded-full border border-slate-700">
                <span id="template-breadcrumb" class="text-indigo-400 font-semibold ml-1 tracking-wide inline-block align-bottom truncate max-w-[50px]">Untitled</span>
            </div>
           <button id="back-to-gallery-btn" class="hidden m-4 items-center gap-2 px-3 py-1.5 bg-slate-800 text-slate-300 text-sm rounded-lg border border-slate-700">
           Back
           </button>
           <div class="text-xs">
               <span class="text-indigo-400 font-semibold ml-1">SSC.</span>
           </div>
        </div>

    </header>

    <main class="flex-grow relative overflow-hidden bg-gradient-to-br from-dark-900 to-slate-900">
        <div id="template-selector" class="h-full overflow-y-auto">
            <div class="max-w-7xl mx-auto px-4 py-10">
                <div id="template-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"></div>
            </div>
        </div>

        <div id="iframe-container" class="hidden absolute inset-0 bg-dark-900 z-40">
            <div id="loading-overlay" class="absolute inset-0 bg-dark-900/95 flex items-center justify-center z-50">
                <div class="flex flex-col items-center">
                    <div class="spinner mb-4"></div>
                    <p class="text-slate-300 animate-pulse">Opening Editor...</p>
                </div>
            </div>
            <iframe id="viewer" src="about:blank" class="w-full h-full border-0"></iframe>
        </div>
    </main>
<footer>&copy; 2026 Sachethan Salian Creation</footer>

    <!-- Rename User ID Modal -->
    <div id="rename-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 hidden">
        <div class="bg-dark-800 border border-slate-700 rounded-xl p-5 max-w-xs w-full shadow-2xl">
            <h3 class="text-sm font-semibold text-white mb-1">Rename User ID</h3>
            <p class="text-xs text-slate-400 mb-3">Updating will change your local user profile name.</p>
            <input 
                type="text" 
                id="rename-input" 
                maxlength="20"
                class="w-full px-3 py-2 bg-dark-900 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-indigo-500 font-mono tracking-wide mb-4 placeholder-slate-500" 
                placeholder="Enter new name" 
            />
            <div class="flex items-center justify-end gap-2 text-xs">
                <button id="cancel-rename-btn" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition">Cancel</button>
                <button id="save-rename-btn" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-semibold transition active:scale-95">Save</button>
            </div>
        </div>
    </div>

    <script>
        const templates = [
            { id: '1', title: 'ಅನ್ನಪೂರ್ಣ ಆಶೀರ್ವಾದ', previewImage: 'annapoorna/image/preview.webp', url: 'annapoorna/annapoorna1.html' },
            { id: '2', title: 'ಶ್ರೀ ಶರಭೇಶ್ವರ ಭಜನೆ', previewImage: 'sharabeswara/image/preview.webp', url: 'sharabeswara/sharabeswara.html' }
        ];

        const grid = document.getElementById('template-grid');
        const viewer = document.getElementById('viewer');
        const selector = document.getElementById('template-selector');
        const container = document.getElementById('iframe-container');
        const loader = document.getElementById('loading-overlay');
        const backBtn = document.getElementById('back-to-gallery-btn');
        const nav = document.getElementById('editor-nav');
        const breadcrumb = document.getElementById('template-breadcrumb');

        function render() {
            templates.forEach(t => {
                const card = document.createElement('div');
                card.className = 'template-card bg-dark-800 border border-slate-700 rounded-xl overflow-hidden cursor-pointer p-4';
                card.innerHTML = `
                    <img src="${t.previewImage}" class="w-full h-40 object-cover rounded-lg mb-4" onerror="this.src='https://placehold.co/400x225/1e293b/6366f1?text=Template'">
                    <h3 class="text-white font-bold mb-3">${t.title}</h3>
                    <button class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm font-semibold transition">Open Editor</button>
                `;
                card.onclick = () => {
                    loader.classList.remove('hidden');
                    selector.classList.add('hidden');
                    container.classList.remove('hidden');
                    backBtn.classList.remove('hidden');
                    nav.classList.remove('hidden');
                    breadcrumb.textContent = t.title;
                    viewer.src = t.url;
                };
                grid.appendChild(card);
            });
        }

        backBtn.onclick = () => {
            viewer.src = 'about:blank';
            selector.classList.remove('hidden');
            container.classList.add('hidden');
            backBtn.classList.add('hidden');
            nav.classList.add('hidden');
        };

        viewer.onload = () => loader.classList.add('hidden');
        render();
    </script>

<!-- Background Telemetry & ID Manager Script -->
<script>
(function() {
  const SPREADSHEET_ID = "11VJ9sxd6MC8zcEBMvKMeuztG-zAaFGt7eI7IwdPS5JI";
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwkCSWw1-XIAmPNkUfQWlJpeClq1rjuZ-40G7DmMFfxUfWgmCJm6wdqyZUTlJeOoJEmZw/exec";

  function getDeviceAndBrowser() {
    const ua = navigator.userAgent;
    let browser = "Browser";
    let device = "Device";

    if (ua.includes("Firefox/")) browser = "Firefox";
    else if (ua.includes("Edg/")) browser = "Edge";
    else if (ua.includes("Chrome/")) browser = "Chrome";
    else if (ua.includes("Safari/")) browser = "Safari";

    if (/android/i.test(ua)) device = "Android";
    else if (/iPad|iPhone|iPod/.test(ua)) device = "iOS";
    else if (/Win/i.test(ua)) device = "Windows";
    else if (/Mac/i.test(ua)) device = "Mac";
    else if (/Linux/i.test(ua)) device = "Linux";

    return { device, browser };
  }

  function getFormattedDateTime() {
    const now = new Date();
    const day = String(now.getDate()).padStart(2, '0');
    const month = now.getMonth() + 1;
    const dateStr = `${day}-${month}`;

    let hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12;
    hours = hours ? hours : 12;
    const timeStr = `${String(hours).padStart(2, '0')}:${minutes} ${ampm}`;

    return { date: dateStr, time: timeStr, fullYear: now.getFullYear() };
  }

  function getOrCreateUserId() {
    let uid = localStorage.getItem("app_user_id");
    if (!uid) {
      const { device, browser } = getDeviceAndBrowser();
      const { date, fullYear } = getFormattedDateTime();
      const randomSeed = Math.random().toString(36).substring(2);

      const rawSeed = `${device}${browser}${date}${fullYear}${randomSeed}`;
      let hash = 0;
      for (let i = 0; i < rawSeed.length; i++) {
        hash = (Math.imul(31, hash) + rawSeed.charCodeAt(i)) >>> 0;
      }

      const chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      let shortCode = "";
      while (shortCode.length < 5) {
        shortCode += chars[hash % chars.length];
        hash = Math.floor(hash / chars.length) ^ (Math.random() * 1000 | 0);
      }

      uid = shortCode.slice(0, 5);
      localStorage.setItem("app_user_id", uid);
    }
    return uid;
  }

  function trackVisit(customId) {
    const userId = customId || getOrCreateUserId();

    const idEl = document.getElementById("display-user-id");
    if (idEl) idEl.textContent = userId;

    const { date, time } = getFormattedDateTime();
    const screenRes = `${window.screen.width}x${window.screen.height}`;

    const payload = {
      spreadsheetId: SPREADSHEET_ID,
      userId: userId,
      date: date,
      time: time,
      screen: screenRes,
      platform: navigator.platform || "Unknown",
      userAgent: navigator.userAgent
    };

    console.group("Telemetry Tracker");
    console.log("User ID:", payload.userId);
    console.log("Visit Date:", payload.date);
    console.log("Visit Time:", payload.time);
    console.log("Screen Dimension:", payload.screen);
    console.log("Payload:", payload);
    console.groupEnd();

    if (navigator.sendBeacon) {
      const blob = new Blob([JSON.stringify(payload)], { type: "text/plain" });
      navigator.sendBeacon(APPS_SCRIPT_URL, blob);
    } else {
      fetch(APPS_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      }).catch(err => console.warn("Tracker fetch failed silently:", err));
    }
  }

  // Rename Dialog Setup
  function setupRenameModal() {
    const userIdBtn = document.getElementById("user-id-btn");
    const modal = document.getElementById("rename-modal");
    const input = document.getElementById("rename-input");
    const cancelBtn = document.getElementById("cancel-rename-btn");
    const saveBtn = document.getElementById("save-rename-btn");
    const idEl = document.getElementById("display-user-id");

    if (!userIdBtn || !modal || !input) return;

    userIdBtn.addEventListener("click", () => {
      input.value = localStorage.getItem("app_user_id") || idEl.textContent;
      modal.classList.remove("hidden");
      input.focus();
    });

    cancelBtn.addEventListener("click", () => {
      modal.classList.add("hidden");
    });

    saveBtn.addEventListener("click", () => {
      const newName = input.value.trim().replace(/[^a-zA-Z0-9_-]/g, "");
      if (newName) {
        localStorage.setItem("app_user_id", newName);
        idEl.textContent = newName;
        modal.classList.add("hidden");
        // Log an immediate entry with the new name
        trackVisit(newName);
      }
    });

    modal.addEventListener("click", (e) => {
      if (e.target === modal) modal.classList.add("hidden");
    });
  }

  window.addEventListener("DOMContentLoaded", () => {
    trackVisit();
    setupRenameModal();
  });
})();
</script>
</body>
</html>
